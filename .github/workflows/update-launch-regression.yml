name: Update launch regression
on:
  push:
    branches: [ci/windows-self-update-regression]
  workflow_dispatch:
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test production installer launcher without installing Glass
        shell: pwsh
        run: |
          $module = (Resolve-Path crates/glass-host/src/update/launch.rs).Path
          '#[path = r"' + $module + '"] mod launch;' | Set-Content "$env:RUNNER_TEMP/launch-harness.rs"
          rustc --edition=2024 --test "$env:RUNNER_TEMP/launch-harness.rs" -o "$env:RUNNER_TEMP/launch-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) { exit 0 }
          & "$env:RUNNER_TEMP/launch-tests.exe" --nocapture
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-update-launch-tests
          path: ${{ runner.temp }}/launch-tests.exe
